name: CI

# The mod's tests and the helper's tests. Linux only: no Herdr app and no window.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Mod and helper tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xplat -> target

      - name: Build the helper
        run: cargo build --locked --manifest-path xplat/Cargo.toml -p flockbook-modfeed

      - name: Helper tests
        run: cargo test --locked --manifest-path xplat/Cargo.toml -p flockbook-modfeed -p herdr-core

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The mod's tests, with the helper that this run built (sidecar.real.test.mjs).
      - name: Mod tests
        working-directory: herdr-app
        env:
          FLOCKBOOK_MODFEED: ${{ github.workspace }}/xplat/target/debug/flockbook-modfeed
        run: npm test
