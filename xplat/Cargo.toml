[workspace]
resolver = "2"
members = ["herdr-core", "herdr-contr-feed", "herdr-contr-orch"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
debug = "line-tables-only"

# The helper is copied to other machines (hc file.write, 8 MB a call): no symbols or line tables in it.
[profile.release.package.herdr-contr-feed]
strip = true
debug = false
