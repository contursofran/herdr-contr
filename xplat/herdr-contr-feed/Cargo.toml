[package]
name = "herdr-contr-feed"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The herdr-contr herdr-app mod's sidecar (docs/protocol.md), on herdr-core."

[[bin]]
name = "herdr-contr-feed"
path = "src/main.rs"

[lib]
name = "modfeedkit"
path = "src/lib.rs"

# herdr-mod: the Herdr app mod (herdr-app/) in `install` and in `health`. Without it, the helper is the backend
# only: `install` is the backend install, and the build reads no file of herdr-app/.
[features]
default = ["herdr-mod"]
herdr-mod = []

[dependencies]
herdr-core = { path = "../herdr-core" }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std"] }
unicode-segmentation = "1"
sha2 = "0.10"
indexmap = { version = "2", features = ["serde"] }
base64 = "0.22.1"
# serve: the phone page in the binary, and its WebSocket (no TLS: Tailscale Serve does that).
rust-embed = { version = "8", features = ["debug-embed"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
# serve: Web Push (RFC 8291 message encryption, RFC 8292 VAPID).
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "std"] }
hkdf = "0.12"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# phone: the QR code of the page's address (drawn as our own SVG; no image or renderer features).
qrcode = { version = "0.14", default-features = false }
# mermaid: a code block with the language mermaid, drawn to SVG (pure Rust, no browser).
mermaid-rs-renderer = { version = "0.3.1", default-features = false }

[dev-dependencies]
tempfile = "3"
